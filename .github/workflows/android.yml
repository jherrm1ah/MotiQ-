name: Android APK

# Builds an installable debug APK of the Motiq Android app (Capacitor, see capacitor.config.json).
# The screens are packed inside the app, and it can talk to Bluetooth OBD-II adapters and use the
# phone's speech for Car Mode. The APK is saved as a workflow artifact, committed to the
# `android-apk` branch and, from main, published as a GitHub Release
# (https://github.com/<owner>/<repo>/releases/latest/download/Motiq.apk).
#
# Debug builds are signed with the fixed key in android/app/motiq-debug.keystore so each new APK
# installs over the last one. Never upload them to the Play Store.
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/lib/obd.js"
      - "src/lib/voice.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "src/lib/obd.js"
      - "src/lib/voice.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          cp "$APK" out/Motiq-debug.apk
          {
            echo "Motiq debug APK"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "size_bytes: $(stat -c %s out/Motiq-debug.apk)"
            echo "sha256: $(sha256sum out/Motiq-debug.apk | cut -d' ' -f1)"
            echo
            echo "== aapt2 dump badging =="
            "$BT/aapt2" dump badging out/Motiq-debug.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|uses-permission|launchable-activity)"
            echo
            echo "== apksigner verify =="
            "$BT/apksigner" verify --verbose --print-certs out/Motiq-debug.apk | grep -E "Verifies|Verified using|Signer #1 certificate (DN|SHA-256)"
          } | tee out/BUILD-INFO.txt
          grep -q "package: name='com.orynthra.motiq'" out/BUILD-INFO.txt
          grep -q "application-label:'Motiq'" out/BUILD-INFO.txt
          grep -q "android.permission.BLUETOOTH_CONNECT" out/BUILD-INFO.txt
          grep -q "android.permission.RECORD_AUDIO" out/BUILD-INFO.txt
          NAME=$(sed -n 's/^VERSION_NAME=//p' android/version.properties)
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$((MA * 10000 + MI * 100 + PA))
          grep -q "versionCode='$CODE' versionName='$NAME'" out/BUILD-INFO.txt
          grep -q "^Verifies" out/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Motiq-debug-apk
          path: out/
          retention-days: 30

      - name: Publish to the android-apk branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b android-apk
          printf '# Motiq debug APK\n\n`Motiq-debug.apk` is the latest debug build of the Motiq Android app. Details are in `BUILD-INFO.txt`. For your own phone only; not for the Play Store.\n' > README.md
          git add -A
          git commit -q -m "Motiq debug APK from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-apk

      - name: Publish the GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(sed -n 's/^VERSION_NAME=//p' android/version.properties)
          TAG="android-v$NAME"
          cp out/Motiq-debug.apk out/Motiq.apk
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/Motiq.apk out/BUILD-INFO.txt --clobber
          else
            gh release create "$TAG" out/Motiq.apk out/BUILD-INFO.txt --target "$GITHUB_SHA" --latest \
              --title "Motiq for Android $NAME" \
              --notes "Install Motiq.apk on your Android phone. Test build signed with Motiq's debug key; not the Play Store version."
          fi
